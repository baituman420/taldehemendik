services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taldehemendik
      POSTGRES_USER: talde
      POSTGRES_PASSWORD: talde_dev_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talde -d taldehemendik"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - talde_vs01_pg:/var/lib/postgresql/data

volumes:
  talde_vs01_pg:
